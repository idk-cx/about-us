<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <pattern id="scan" width="4" height="6" patternUnits="userSpaceOnUse">
      <rect width="4" height="6" fill="transparent"/>
      <rect width="4" height="2" fill="rgba(0,0,0,0.22)"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="52%" r="72%">
      <stop offset="60%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.42"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- window -->
  <rect x="0" y="0" width="1024" height="1024" rx="120" fill="#061014"/>
  <rect x="42" y="42" width="940" height="940" rx="96" fill="#0A1418" stroke="#1E3238" stroke-width="6"/>
  <!-- title bar -->
  <path d="M42 138 h940 v-0 a96 96 0 0 0 -96 -96 h-748 a96 96 0 0 0 -96 96 z" fill="#0E1B20"/>
  <path d="M138 42 h748 a96 96 0 0 1 96 96 v22 h-940 v-22 a96 96 0 0 1 96 -96 z" fill="#0E1B20"/>
  <line x1="42" y1="160" x2="982" y2="160" stroke="#1E3238" stroke-width="6"/>
  <circle cx="118" cy="101" r="19" fill="#E06C6C"/>
  <circle cx="178" cy="101" r="19" fill="#E0A458"/>
  <circle cx="238" cy="101" r="19" fill="#7CC4C7"/>
  <!-- screen text -->
  <g font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" fill="#9FE3E6" filter="url(#glow)">
    <text x="512" y="560" text-anchor="middle" font-size="150" letter-spacing="-8">
      <tspan fill="#5E8A8E" font-size="110">$ </tspan>¯\_(<tspan font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif">ツ</tspan>)_/¯
    </text>
    <text x="512" y="760" text-anchor="middle" font-size="96" fill="#D9F4F5"><tspan fill="#7CC4C7" font-weight="bold">idk</tspan>.<tspan fill="#7CC4C7" font-weight="bold">c</tspan>x</text>
  </g>
  <!-- cursor -->
  <rect x="726" y="686" width="40" height="84" fill="#9FE3E6" opacity="0.95"/>
  <!-- crt overlays -->
  <rect x="42" y="42" width="940" height="940" rx="96" fill="url(#scan)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="120" fill="url(#vig)"/>
</svg>
