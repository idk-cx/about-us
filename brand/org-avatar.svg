<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="screen" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0E2328"/>
      <stop offset="100%" stop-color="#050C0E"/>
    </radialGradient>
  </defs>
  <!-- solid screen, one bold frame -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#screen)"/>
  <rect x="36" y="36" width="952" height="952" rx="72" fill="none" stroke="#5CE1E6" stroke-width="20"/>
  <!-- three terminal dots, big enough to survive 48 px -->
  <circle cx="126" cy="122" r="26" fill="#FF6B6B"/>
  <circle cx="204" cy="122" r="26" fill="#FFB347"/>
  <circle cx="282" cy="122" r="26" fill="#5CE1E6"/>
  <g font-family="DejaVu Sans Mono, Noto Sans Mono, monospace" font-weight="bold" filter="url(#glow)">
    <!-- the shrug fills the width -->
    <text x="512" y="480" text-anchor="middle" font-size="150" letter-spacing="-12" fill="#FFFFFF">¯\_(<tspan font-family="Noto Sans CJK JP, Noto Sans JP, sans-serif" font-weight="bold">ツ</tspan>)_/¯</text>
    <!-- idk.cx, the part that must read -->
    <text x="512" y="796" text-anchor="middle" font-size="220" letter-spacing="-10" fill="#FFFFFF"><tspan fill="#5CE1E6">idk</tspan>.<tspan fill="#5CE1E6">cx</tspan></text>
  </g>
</svg>
